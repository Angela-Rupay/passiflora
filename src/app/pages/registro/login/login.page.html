<ion-content class="ion-padding login-content">
  <div class="login-wrapper">
    <!-- Logo e Identidad centrado -->
    <div class="login-header">
      <div class="brand-logo-container">
        <ion-icon name="flower-outline" class="brand-logo-icon"></ion-icon>
      </div>
      <h1 class="brand-title">Passiflora</h1>
      <p class="brand-subtitle">Inhala... Exhala...</p>
    </div>

    <!-- Pestañas Ingreso / Registro alineadas con seccionActual -->
    <ion-segment [(ngModel)]="seccionActual" class="custom-segment">
      <ion-segment-button value="ingreso">
        <ion-label>Ingresar</ion-label>
      </ion-segment-button>
      <ion-segment-button value="registro">
        <ion-label>Registro</ion-label>
      </ion-segment-button>
    </ion-segment>

    <!-- FORMULARIO DE INGRESO -->
    @if (seccionActual === 'ingreso') {
      <form (ngSubmit)="alIniciarSesion()" class="form-container">
        <div class="input-item">
          <ion-input
            type="email"
            [(ngModel)]="correoIngreso"
            name="correoIngreso"
            placeholder="Correo electrónico"
            fill="outline"
            class="custom-input"
            required>
          </ion-input>
        </div>

        <div class="input-item">
          <ion-input
            type="password"
            [(ngModel)]="claveIngreso"
            name="claveIngreso"
            placeholder="Contraseña"
            fill="outline"
            class="custom-input"
            required>
          </ion-input>
        </div>

        <ion-button expand="block" type="submit" class="btn-login">
          INICIAR SESIÓN
        </ion-button>
      </form>
    }

    <!-- FORMULARIO DE REGISTRO -->
    @if (seccionActual === 'registro') {
      <form (ngSubmit)="alRegistrar()" class="form-container">
        <div class="input-item">
          <ion-input
            type="text"
            [(ngModel)]="nombreRegistro"
            name="nombreRegistro"
            placeholder="Nombre completo"
            fill="outline"
            class="custom-input"
            required>
          </ion-input>
        </div>

        <div class="input-item">
          <ion-input
            type="email"
            [(ngModel)]="correoRegistro"
            name="correoRegistro"
            placeholder="Correo electrónico"
            fill="outline"
            class="custom-input"
            required>
          </ion-input>
        </div>

        <div class="input-item">
          <ion-input
            type="password"
            [(ngModel)]="claveRegistro"
            name="claveRegistro"
            placeholder="Contraseña"
            fill="outline"
            class="custom-input"
            required>
          </ion-input>
        </div>

        <div class="input-item">
          <ion-input
            type="password"
            [(ngModel)]="confirmarClaveRegistro"
            name="confirmarClaveRegistro"
            placeholder="Confirmar contraseña"
            fill="outline"
            class="custom-input"
            required>
          </ion-input>
        </div>

        <ion-button expand="block" type="submit" class="btn-login">
          CREAR CUENTA
        </ion-button>
      </form>
    }
  </div>
</ion-content>
