<ion-content>
  <main class="page-shell">
    <app-tab-header></app-tab-header>
    <header class="page-heading">
      <p class="eyebrow">Hola {{ nombreUsuario }} 💜</p>
      <h1>Qué bueno tenerte aquí.</h1>
      <p>Este es tu espacio para respirar, conectar contigo y cuidar de tu bienestar.</p>
    </header>
    <nav class="card-list" aria-label="Herramientas de bienestar">
      <app-action-card ruta="/respiracion" icono="leaf-outline" etiqueta="UN MOMENTO PARA TI" titulo="Respira conmigo" descripcion="Regálate unos minutos para encontrar calma y conectar con el presente."></app-action-card>
      <app-action-card ruta="/gad7" [parametros]="{nombre: nombreUsuario}" icono="heart-outline" etiqueta="ESCUCHA CÓMO TE SIENTES" titulo="¿Cómo te has sentido?" descripcion="Responde el cuestionario GAD-7 sobre las últimas dos semanas. Es orientativo y no sustituye una evaluación profesional."></app-action-card>
      <app-action-card ruta="/tarjetas" icono="chatbubble-ellipses-outline" etiqueta="PALABRAS QUE TE ACOMPAÑAN" titulo="Tarjetas de realidad" descripcion="Escribe un mensaje amable para leerlo cuando necesites calma."></app-action-card>
    </nav>
    <p class="frase-bottom">No tienes que tener todo resuelto. A veces, simplemente respirar es suficiente.</p>
  </main>
</ion-content>
